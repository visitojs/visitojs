name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# the deploy job holds the Pages credential; nothing here restores a cache that another run could have written
cache-mode: none

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demo page
    # GitHub Pages is not available to a private repository on the free plan
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: mkdir _site && cp demo/index.html demo/llms.txt demo/favicon.ico demo/favicon-32.png demo/favicon-180.png demo/favicon-192.png demo/favicon-512.png demo/logo-light-624.png demo/logo-dark-624.png demo/social-preview.png dist/visito.min.js _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Holds the deploy credential, so it runs nothing but GitHub's deploy action
  deploy:
    name: Publish the demo page
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
