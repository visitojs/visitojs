version: 2
updates:
  - package-ecosystem: npm
    directory: /
    labels: [dependencies]
    schedule:
      interval: weekly
    # the build tools run in the release build; most malicious releases are found and pulled within days, so wait a week
    cooldown:
      default-days: 7
      semver-major-days: 14
    # one pull request for the minor and patch updates of the build tools; a major version still arrives on its own
    groups:
      build-tools:
        update-types: [minor, patch]
        patterns: ['*']
    ignore:
      # moves together with the image tag and digest in .github/workflows/ci.yml and lab/containers/browsers.Dockerfile
      - dependency-name: playwright
      # TypeScript 7 no longer compiles to ES5 (tsc 7.0.2: "Option 'target=ES5' has been removed"), and the library ships ES5:
      # a move to 7 is a decision about the build, not an update
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    labels: [dependencies, "area: ci"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # the actions are pinned by commit; Dependabot moves the SHA and the # vX.Y.Z comment beside it together
    groups:
      actions:
        patterns: ['*']
